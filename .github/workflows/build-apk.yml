name: Aegis Sovereign - Master Strategic Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # يسمح لك ببدء البناء يدوياً في أي لحظة تكتيكية

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # ضروري لمنح النظام صلاحية إنشاء الإصدارات السيادية

    steps:
      - name: 📥 Checkout Sovereign Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK 17 (Aegis Standard)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🛡️ Grant Execute Permission
        run: chmod +x gradlew

      # بناء النسخة النهائية (Release) لضمان تفعيل درع الحماية وتصغير الكود
      - name: 🏗️ Build Master Sovereign APK
        run: ./gradlew assembleRelease --stacktrace

      # دمج ميزة التسمية لضمان الهوية السيادية للملف الناتج
      - name: 🆔 Rename and Verify APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          mv "$APK_PATH" Aegis_Tactical_v1.0.8_Master_Sovereign.apk
          echo "FINAL_APK=Aegis_Tactical_v1.0.8_Master_Sovereign.apk" >> $GITHUB_ENV

      # حفظ النسخة في Artifacts للوصول السريع
      - name: 💾 Upload Internal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aegis-Master-Sovereign-Build
          path: ${{ env.FINAL_APK }}

      # الرفع الاستراتيجي لقسم الإصدارات (Releases) لإنشاء رابط دائم محصن
      - name: 🚀 Global Strategic Release
        uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          files: ${{ env.FINAL_APK }}
          tag_name: v1.0.8-Sovereign-Final
          name: Aegis Tactical v1.0.8 "Master Sovereign"
          body: |
            ### 🎖️ Aegis Tactical v1.0.8 - Master Build
            **Architect:** Colonel Ali Al-Ammari
            **Status:** 100% Verified & Secure
            - محرك الذكاء الاصطناعي v7.0 نشط.
            - المصفوفة الصوتية v2.3.0 مدمجة.
            - درع الكوانتم وبروتوكول التخفي مفعلان.
            - هذا الإصدار مستقل تماماً ولا يتطلب عتاداً خارجياً.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
