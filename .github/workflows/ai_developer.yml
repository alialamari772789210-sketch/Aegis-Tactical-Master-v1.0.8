name: AI Autonomous Developer
on:
  push:
    paths:
      - 'workspace/**.zip' # يعمل فقط عند رفع ملف مضغوط في هذا المجلد

jobs:
  develop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install openai

      - name: Run AI Core
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} # تأكد من إضافة المفتاح في Secrets
        run: python src/core.py
