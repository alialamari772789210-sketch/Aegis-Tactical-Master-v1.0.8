name: Aegis Sovereign - Sync & Build Secure

on:
  push:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 */6 * * *' # مزامنة تلقائية كل 6 ساعات كما في الكود 1
  workflow_dispatch: # يسمح لك بتشغيل العمل يدوياً في أي وقت

jobs:
  operational_sync_and_build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      # 1. سحب الكود من المستودع باستخدام أعلى معايير الأمان SHA
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 

      # 2. تنفيذ بروتوكول المزامنة (الذي كان في الكود رقم 1)
      - name: Execute Protocol Sync
        run: |
          if [ -f "./sync.sh" ]; then
            chmod +x ./sync.sh
            ./sync.sh
          else
            echo "Notice: sync.sh not found, skipping sync protocol."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. تجهيز البيئة البرمجية (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@8df103950255581bdf903f4a778395628a997a07
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 4. منح صلاحيات المحرك (مع خاصية التخطي الذكي || true)
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      # 5. تصنيع النسخة النهائية APK
      - name: Build with Gradle
        run: ./gradlew assembleRelease

      # 6. رفع النسخة إلى قسم الإصدارات (Releases)
      - name: Upload Secure APK Release
        uses: softprops/action-gh-release@c062e08bd570ba92447465697362c9035c36b9e9
        with:
          files: app/build/outputs/apk/release/*.apk
          tag_name: v1.0.8-Release
          name: Aegis Tactical v1.0.8-Release (Sovereign Node)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
