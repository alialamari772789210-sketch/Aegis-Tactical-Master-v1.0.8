plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {

    // الهوية البرمجية للتطبيق
    namespace 'com.jamesfirstok.aegis'
    compileSdk 34

    defaultConfig {

        applicationId "com.jamesfirstok.aegis"

        minSdk 24
        targetSdk 34

        versionCode 8
        versionName "1.0.8-Sovereign-Master"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // دعم Vector Drawables
        vectorDrawables {
            useSupportLibrary true
        }

        // إعدادات C++
        externalNativeBuild {
            cmake {

                cppFlags "-std=c++17"

                // دعم المعماريات
                abiFilters "armeabi-v7a", "arm64-v8a"
            }
        }
    }

    // =========================================
    // Build Types
    // =========================================

    buildTypes {

        // نسخة التطوير
        debug {
            minifyEnabled false
        }

        // نسخة الإصدار
        release {

            // تم تعطيل Proguard مؤقتاً لضمان نجاح البناء
            // يمكن تفعيله لاحقاً بعد استقرار المشروع
            minifyEnabled false

            // احتياطي للمستقبل
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    // =========================================
    // ربط CMake
    // =========================================

    externalNativeBuild {
        cmake {

            path "src/main/cpp/CMakeLists.txt"

            version "3.22.1"
        }
    }

    // =========================================
    // Java + Kotlin
    // =========================================

    compileOptions {

        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {

        jvmTarget = '17'
    }

    // =========================================
    // الميزات
    // =========================================

    buildFeatures {

        compose true

        // دعم XML + ViewBinding
        viewBinding true
    }

    // =========================================
    // Compose
    // =========================================

    composeOptions {

        kotlinCompilerExtensionVersion '1.5.1'
    }
}

// =========================================
// Dependencies
// =========================================

dependencies {

    // =====================================
    // Android Core
    // =====================================

    implementation 'androidx.core:core-ktx:1.12.0'

    implementation 'androidx.appcompat:appcompat:1.6.1'

    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // =====================================
    // Jetpack Compose
    // =====================================

    implementation platform('androidx.compose:compose-bom:2023.08.00')

    implementation 'androidx.compose.ui:ui'

    implementation 'androidx.compose.ui:ui-graphics'

    implementation 'androidx.compose.ui:ui-tooling-preview'

    implementation 'androidx.compose.material3:material3'

    implementation 'androidx.activity:activity-compose:1.8.2'

    // =====================================
    // AI Engine
    // =====================================

    implementation 'org.tensorflow:tensorflow-lite:2.12.0'

    // =====================================
    // Networking
    // =====================================

    implementation 'com.squareup.retrofit2:retrofit:2.9.0'

    // =====================================
    // Security
    // =====================================

    implementation "androidx.security:security-crypto:1.1.0-alpha06"

    // =====================================
    // Tactical Systems
    // =====================================

    // تم تعطيلها مؤقتاً لضمان نجاح البناء
    // يمكن إعادتها لاحقاً بعد استقرار الـ APK

    // implementation 'com.github.mik3y:usb-serial-for-android:3.7.0'

    // implementation 'org.mavlink:mavlink-sdk:2.4.1'

    // implementation 'com.google.android.gms:play-services-maps:18.2.0'
}
