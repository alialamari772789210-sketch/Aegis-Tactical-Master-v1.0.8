name: AI Core Deployment

on: [push, workflow_dispatch]

jobs:
  operational_run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # حل مشكلة تعارض الحزم مع نظام التشغيل
          pip install --ignore-installed typing-extensions --break-system-packages || pip install --ignore-installed typing-extensions
          # تثبيت المتطلبات مع تخطي حماية النظام
          pip install -r requirements.txt --break-system-packages || pip install -r requirements.txt
          mkdir -p workspace

      - name: 4. Check OpenAI API Key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "⚠️ OPENAI_API_KEY is empty; add it in GitHub Secrets first."
            exit 1
          fi
          echo "✅ OPENAI_API_KEY is set."

      - name: 5. Execute Autonomous Logic (SUDO Mode)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # تنصيب المكتبات في بيئة الـ sudo مع تجاوز قيود النظام (Debian RECORD Error Fix)
          sudo pip install --ignore-installed typing-extensions --break-system-packages || true
          sudo pip install scapy numpy pandas openai langchain langchain-openai langchain-community python-dotenv --break-system-packages || sudo pip install scapy numpy pandas openai langchain langchain-openai langchain-community python-dotenv
          
          # تنفيذ المنطق العملياتي مع صلاحيات الجذر
          sudo python3 -c "
          try:
              import sys
              import os
              sys.path.append(os.getcwd())
              from agent_executor import agent_executor
              response = agent_executor.invoke({'input': 'افحص الرادار، وإذا وجدت أهدافاً شوش عليها فوراً ثم قم بتوثيق العملية في تقرير الرصد داخل المجلد العملياتي'})
              print(response)
          except ImportError as e:
              print(f'❌ Error: {e}')
          except Exception as e:
              print(f'Critical Failure: {e}')
          "

      - name: 6. Commit & Push Tactical Report
        run: |
          git config --global user.name "Aegis-Sovereign-Bot"
          git config --global user.email "aegis-bot@github.com"
          git add workspace/DETECTION_REPORT.md || true
          git commit -m "🛡️ تحديث تقرير الرصد العملياتي [Automated]" || echo "لا توجد تغييرات للتوثيق"
          git push
