name: AI Auto-Developer & Deployer
on:
  push:
    paths:
      - 'workspace/project.zip' # يعمل التلقائي عند رفع هذا الملف

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # إذن حيوي للسماح للذكاء الاصطناعي بالكتابة في مستودعك
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install openai

      - name: Run AI Development Core
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python src/core.py

      - name: Push Developed ZIP to Repo
        run: |
          git config --global user.name "AI-Autonomous-Bot"
          git config --global user.email "bot@ai-core.com"
          git add workspace/developed_project.zip
          git commit -m "تم التطوير بواسطة الذكاء الاصطناعي: تم تحديث المشروع تلقائياً"
          git push
