plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.jamesfirstok.aegis'
    compileSdk 34

    defaultConfig {
        applicationId "com.jamesfirstok.aegis"
        minSdk 24
        targetSdk 34
        versionCode 8
        versionName "1.0.8-Sovereign-Master"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        vectorDrawables {
            useSupportLibrary true
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                abiFilters "armeabi-v7a", "arm64-v8a"
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false // 🔥 أوقفنا Proguard مؤقتاً لضمان نجاح البناء
            // يمكن تفعيله لاحقاً
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        viewBinding true // نحافظ عليه
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.1'
    }
}

dependencies {

    // 🔹 Core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // 🔹 Compose
    implementation platform('androidx.compose:compose-bom:2023.08.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.8.2'

    // 🔹 AI
    implementation 'org.tensorflow:tensorflow-lite:2.12.0'

    // 🔹 Networking
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'

    // 🔹 Security
    implementation "androidx.security:security-crypto:1.1.0-alpha06"

    // 🟡 مؤقتاً نوقف المكتبات الخطيرة (نرجعها لاحقاً بشكل احترافي)
    // implementation 'org.mavlink:mavlink-sdk:2.4.1'
    // implementation 'com.github.mik3y:usb-serial-for-android:3.7.0'
    // implementation 'com.google.android.gms:play-services-maps:18.2.0'
}
