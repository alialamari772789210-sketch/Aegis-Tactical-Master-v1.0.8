name: AI Autonomous Master Core

on:
  push:
    branches:
      - Master

jobs:
  ai-process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install AI Dependencies
        run: pip install openai>=1.0.0

      - name: Run AI Debugger & Developer
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python src/core.py

      # --- مرحلة التنظيم الهيكلي ومنع تعارضات النظام ---
      - name: Organize and Clean Gradle
        run: |
          echo "🛡️ جاري تنظيف وتنظيم الهيكل التكتيكي..."
          mkdir -p gradle/wrapper
          
          # إصلاح نهايات الأسطر (لحل مشكلة ملفات ويندوز على لينكس)
          sed -i 's/\r$//' gradlew || echo "Already Linux format"
          
          # نقل الملفات لمكانها الصحيح إذا وُجدت في الجذر
          [ -f gradle-wrapper.jar ] && mv gradle-wrapper.jar gradle/wrapper/
          [ -f gradle-wrapper.properties ] && mv gradle-wrapper.properties gradle/wrapper/
          
          chmod +x gradlew
          echo "✅ تم تجهيز المحرك بنجاح."

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # --- قبول تراخيص أندرويد آلياً لضمان عدم توقف البناء ---
      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || echo "Licenses already accepted"

      - name: Build Tactical APK
        # استخدام الذاكرة القصوى المتاحة للخادم لضمان معالجة C++
        run: ./gradlew assembleDebug -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Commit and Push Improvements
        run: |
          git config --global user.name "AI-Master-Bot"
          git config --global user.email "bot@ai-master.com"
          git add .
          # استخدام autostash لحماية التغييرات المحلية أثناء المزامنة
          git pull origin Master --rebase --autostash
          git commit -m "🤖 [AI Core] تم تفعيل وضع العمليات وبناء السيادة v1.0.9" || echo "No changes to commit"
          git push origin Master

      - name: Upload Sovereign APK
        if: success() # لا يتم الرفع إلا في حالة نجاح البناء
        uses: actions/upload-artifact@v4
        with:
          name: Aegis-Tactical-v1.0.9-Operational
          path: app/build/outputs/apk/debug/app-debug.apk
