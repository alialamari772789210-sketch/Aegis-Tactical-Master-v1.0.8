name: AI Autonomous Master Core

on:
  push:
    branches:
      - Master

jobs:
  ai-process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install AI Dependencies
        run: pip install openai>=1.0.0

      - name: Run AI Debugger & Developer
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python src/core.py

      # --- المرحلة الاستراتيجية: التنظيم الهيكلي وتصحيح المسارات ---
      - name: AI Logic for Gradle Relocation and Repair
        run: |
          echo "🛡️ جاري البدء في عملية التنظيف والهيكلة الشاملة..."
          
          # 1. إنشاء المجلدات القانونية للمحرك
          mkdir -p gradle/wrapper
          
          # 2. تحريك الملفات من الجذر إلى موقعها العملياتي
          if [ -f "gradle-wrapper.jar" ]; then
            echo "📦 تم العثور على ملف JAR في الجذر، جاري نقله..."
            mv gradle-wrapper.jar gradle/wrapper/
          fi
          
          if [ -f "gradle-wrapper.properties" ]; then
            echo "⚙️ تم العثور على ملف Properties في الجذر، جاري نقله..."
            mv gradle-wrapper.properties gradle/wrapper/
          fi

          # 3. خطة الطوارئ: توليد الملفات إذا فُقدت تماماً من المستودع
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "⚠️ تنبيه: الملفات مفقودة، جاري استدعاء المحرك لتوليد نسخة جديدة..."
            gradle wrapper --gradle-version 8.2
          fi

          # 4. معالجة توافق النصوص وتفعيل الصلاحيات
          sed -i 's/\r$//' gradlew || echo "Format is already correct"
          chmod +x gradlew
          
          echo "✅ اكتملت عملية التنظيم والتصحيح الهيكلي."

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # --- مرحلة حفظ التغييرات وإعادة تثبيتها في المستودع الرئيسي ---
      - name: Commit and Push Structural Fixes
        run: |
          git config --global user.name "AI-Master-Bot"
          git config --global user.email "bot@ai-master.com"
          
          # إضافة كافة الملفات المنظمة والمولدة
          git add gradle/wrapper/gradle-wrapper.jar
          git add gradle/wrapper/gradle-wrapper.properties
          git add gradlew
          git add .
          
          # المزامنة مع المستودع لضمان عدم وجود تعارضات
          git pull origin Master --rebase --autostash
          
          git commit -m "🤖 [AI Core] إعادة هيكلة مسارات Gradle وتصحيح ملفات الـ Wrapper" || echo "No changes to commit"
          git push origin Master
