name: Build AEGIS APK (No Cache)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. استنساخ المستودع
        uses: actions/checkout@v4

      - name: 2. تجهيز Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. تجهيز Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 4. تثبيت متطلبات Python
        run: |
          python -m pip install --upgrade pip
          pip install numpy pyserial

      - name: 5. تثبيت أدوات NDK و CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: 6. إعداد Android SDK مع قبول الترخيص
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: 7. بناء APK (تجاهل التخزين المؤقت)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --no-build-cache --stacktrace

      - name: 8. تجميع ملفات APK
        if: success()
        run: |
          mkdir -p apk_output
          find app/build -name "*.apk" -exec cp {} apk_output/ \;

      - name: 9. رفع APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AEGIS-APK-v7.2.6
          path: apk_output/
