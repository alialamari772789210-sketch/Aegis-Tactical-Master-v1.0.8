name: Tactical Build Pipeline
on:
  push:
    branches: [ "main", "master" ]

jobs:
  deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      
      - name: Initialize Aegis Core
        # استخدام run بحرف صغير كما نصحت به صورة Stack Overflow
        run: |
          chmod +x ./gradlew || true
          echo "Initializing encrypted build sequence for v1.0.8..."
          
      - name: Build APK
        run: ./gradlew assembleRelease
