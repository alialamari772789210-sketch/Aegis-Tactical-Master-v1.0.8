name: Aegis Tactical Master Build

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build AEGIS APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 🛠️ حاقن بيئة العمل: تثبيت بايثون وتفعيله بشكل قياسي لـ Chaquopy
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Grant Execute Permission
        run: chmod +x gradlew

      # 🛠️ أمر الحسم النهائي: تنظيف الكاش (clean) متبوعاً بالتجميع لفرض قراءة الثيم الجديد
      - name: Build APK
        run: ./gradlew clean assembleDebug --stacktrace
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AEGIS-APK
          path: app/build/outputs/apk/debug/*.apk
