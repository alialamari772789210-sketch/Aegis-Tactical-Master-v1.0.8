name: Aegis-Sovereign-Build

on:
  push:
    branches: [ main ] # تأكد أن اسم فرعك الرئيسي هو main
  workflow_dispatch: # هذا الزر سيسمح لك بالبناء يدوياً

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Build APK Debug
        run: ./gradlew assembleDebug
        
      - name: Upload Sovereign APK
        uses: actions/upload-artifact@v4
        with:
          name: Aegis_Tactical_v1.0.8_Final
          path: app/build/outputs/apk/debug/app-debug.apk
