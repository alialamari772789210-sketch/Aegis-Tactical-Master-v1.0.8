plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.jamesfirstok.aegis'
    
    // نبقي compileSdk على 34 لاستخدام أحدث ميزات الأمان البرمجي
    compileSdk 34 

    defaultConfig {
        applicationId "com.jamesfirstok.aegis"
        
        // التوافق مع الأجهزة القديمة (من أندرويد 7.0 فما فوق)
        minSdk 24 
        
        // استهداف أندرويد 12 (API 31) لضمان الوصول العميق للحساسات والترددات
        // أندرويد 12 هو الإصدار العملياتي الأفضل لهذا النوع من التطبيقات
        targetSdk 31 

        versionCode 9
        versionName "1.0.9-Universal-Operational"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                abiFilters "armeabi-v7a", "arm64-v8a" // دعم المعالجات القديمة والحديثة
            }
        }
        
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false 
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.1'
    }
}

dependencies {
    // تم اختيار نسخ المكتبات لضمان التوافق مع targetSdk 31
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
    implementation 'androidx.activity:activity-compose:1.7.2'
    
    // واجهة Compose متوافقة
    implementation platform('androidx.compose:compose-bom:2023.06.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    
    // المكتبات العملياتية (تأكد من توافقها مع API 31)
    implementation 'com.github.wendykierp:JTransforms:3.1'
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation 'com.github.mik3y:usb-serial-for-android:3.7.0'
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
}
