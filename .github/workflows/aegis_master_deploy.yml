name: Aegis Sovereign Deployment (Fix & Build)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # يسمح لك بتشغيل البناء يدوياً من واجهة GitHub

jobs:
  fortify-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # ضروري للسماح للنواة بحفظ الإصلاحات في المستودع

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Setup Python & Java
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Install AI Dependencies
        run: pip install openai python-dotenv

      - name: 4. Run Sovereign Core (AI Fix & Fortify)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python sovereign_core.py # استدعاء نواة السيادة لتطوير الأكواد وتأمينها

      - name: 5. Setup Gradle & Permissions
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: 6. Build Tactical APK
        run: ./gradlew assembleDebug --stacktrace

      - name: 7. Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Aegis-Operational-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: 8. Create Tactical Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.${{ github.run_number }}
          name: Aegis Sovereign Build v2.${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
