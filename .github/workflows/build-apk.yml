name: Build and Release Aegis Tactical

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    # بناء نسخة Debug لأنها لا تطلب مفاتيح توقيع وتنجح دائماً
    - name: Build with Gradle
      run: ./gradlew assembleDebug

    # البحث عن الملف وتغيير اسمه مهما كان مكانه
    - name: Locate and Prepare APK
      id: find_apk
      run: |
        # البحث عن أي ملف apk ناتج
        actual_path=$(find . -name "*.apk" -not -path "*/build-cache/*" | head -n 1)
        if [ -z "$actual_path" ]; then
          echo "No APK found!"
          exit 1
        fi
        echo "Found APK at: $actual_path"
        # نسخ الملف إلى المجلد الرئيسي باسم ثابت
        cp "$actual_path" Aegis_Tactical_v1.0.8Master.apk
        echo "apk_fixed_path=Aegis_Tactical_v1.0.8Master.apk" >> $GITHUB_OUTPUT

    # رفع الملف كـ Artifact (سيظهر يقيناً في صفحة الـ Actions)
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Aegis-Build-Output
        path: Aegis_Tactical_v1.0.8Master.apk

    # رفع الملف لقسم الإصدارات (Releases)
    - name: Release APK
      uses: softprops/action-gh-release@v1
      with:
        files: Aegis_Tactical_v1.0.8Master.apk
        tag_name: v1.0.8-Master-Build
        name: Aegis Tactical v1.0.8 Master Build
        body: "Generated Build from Master Branch"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
