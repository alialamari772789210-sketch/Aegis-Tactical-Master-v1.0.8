name: AI Core Deployment

on: [push, workflow_dispatch]

jobs:
  operational_run:
    runs-on: ubuntu-latest
    permissions:
      contents: write # ضروري للسماح للنظام بحفظ تقرير الرصد في المستودع
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Environment
        run: |
          pip install -r requirements.txt
          mkdir -p workspace # إنشاء غرفة العمليات لضمان وجود مسار للتقارير

      - name: Execute Autonomous Logic
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -c "from agent_executor import agent_executor; agent_executor.invoke({'input': 'افحص الرادار، وإذا وجدت أهدافاً شوش عليها فوراً ثم قم بتوثيق العملية في تقرير الرصد داخل المجلد العملياتي'})"

      - name: Commit & Push Tactical Report
        run: |
          git config --global user.name "Aegis-Sovereign-Bot"
          git config --global user.email "aegis-bot@github.com"
          git add workspace/DETECTION_REPORT.md
          git commit -m "🛡️ تحديث تقرير الرصد العملياتي" || echo "لا توجد تغييرات للتوثيق"
          git push
