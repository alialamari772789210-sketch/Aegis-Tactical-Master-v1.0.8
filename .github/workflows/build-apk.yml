name: Aegis Tactical v7.2.6 - Master Final

on:
  push:
    branches: [ "main", "Master" ]
  workflow_dispatch: 

jobs:
  finalize_build_sequence:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: 📥 Checkout Sovereign Code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17 (Aegis Standard)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🛠️ Setup Gradle (Sovereign Auto-Engine)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: 🏗️ Execute Master Build
        run: gradle assembleDebug --stacktrace

      - name: 🆔 Rename APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          mv "$APK_PATH" Aegis_Tactical_v7.2.6_Master_Final.apk
          echo "FINAL_APK=Aegis_Tactical_v7.2.6_Master_Final.apk" >> $GITHUB_ENV

      - name: 🚀 Global Strategic Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.FINAL_APK }}
          tag_name: v7.2.6-Final
          name: Aegis Tactical v7.2.6 "Master Final"
          body: |
            ### 🎖️ Aegis Tactical v7.2.6 - Master Final
            **Architect:** Colonel Ali Al-Ammari
            **Status:** 100% Verified & Secure
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
