name: Aegis-Master-Sovereign-Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build APK (Debug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Sovereign APK
        uses: actions/upload-artifact@v4
        with:
          name: Aegis_Tactical_v1.0.8_Final
          path: app/build/outputs/apk/debug/*.apk
