name: Aegis Tactical Master Build

on:
  push:
    branches: [ main, Master, "يتقن" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # هذه الخطوة ستقوم بتحميل وتثبيت الـ Wrapper الصحيح آلياً
      - name: Setup Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      # الآن نستخدم ./gradlew (المحرك الخاص بالمشروع) وليس gradle النظام
      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aegis-App-v2
          path: "**/build/outputs/apk/debug/*.apk"
