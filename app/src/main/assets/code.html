<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis Tactical HUD v7.2.6</title>
    <style>
        body {
            background-color: #000;
            color: #00CCFF;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            overflow: hidden; /* لمنع التمرير وضمان ثبات الرادار */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .tactical-hud {
            border: 2px solid #00CCFF;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 204, 255, 0.5);
            background: rgba(0, 20, 40, 0.8);
            position: relative;
            width: 90%;
            max-width: 800px;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            letter-spacing: 5px;
            text-shadow: 2px 2px #000;
            margin-bottom: 10px;
            border-bottom: 1px solid #00CCFF;
            padding-bottom: 10px;
        }

        #signalMatrix {
            background: #00050a;
            border: 1px solid #003366;
            width: 100%;
            height: 200px;
        }

        .telemetry-readout {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .status-glow {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .architect-seal {
            position: absolute;
            bottom: 5px;
            right: 10px;
            font-size: 0.6rem;
            color: #006688;
        }
    </style>
</head>
<body>

    <div class="tactical-hud">
        <h1 class="status-glow">SYSTEM STATUS: AEGIS ACTIVE</h1>
        
        <canvas id="signalMatrix"></canvas>

        <div class="telemetry-readout">
            <div>
                <p>SIGNAL: <span id="signalVal">98%</span></p>
                <p>CORE: <span style="color: #00FF00;">ENCRYPTED</span></p>
            </div>
            <div>
                <p>ARCHITECT: <span style="color: #FFF;">ALI AL-AMMARI</span></p>
                <p>RANK: <span style="color: #FFD700;">COLONEL (ENG)</span></p>
            </div>
        </div>

        <div class="architect-seal">SOVEREIGNTY PROTOCOL v7.2.6 // MASTER STABLE</div>
    </div>

    <script>
        // محاكاة نبضات الرادار وتدفق البيانات (Signal Matrix Logic)
        const canvas = document.getElementById('signalMatrix');
        const ctx = canvas.getContext('2d');

        function drawSignal() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#00CCFF';
            ctx.lineWidth = 2;
            ctx.beginPath();
            
            for (let i = 0; i < canvas.width; i += 10) {
                let h = Math.random() * 50 + 20;
                ctx.moveTo(i, 100 - h);
                ctx.lineTo(i, 100 + h);
            }
            ctx.stroke();
            
            // تحديث عشوائي بسيط لقوة الإشارة لإضفاء واقعية
            document.getElementById('signalVal').innerText = (95 + Math.random() * 5).toFixed(1) + "%";
        }

        setInterval(drawSignal, 150);
    </script>
</body>
</html>
