name: Build Aegis Tactical Master

on:
  push:
    branches: [ main, Master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        run: |
          chmod +x gradlew
          ./gradlew wrapper --gradle-version 8.0

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      # خطوة ذكية للبحث عن ملف الـ APK أينما كان ورفعه
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aegis-App-Package
          path: "**/build/outputs/apk/debug/*.apk" # البحث في كل المجلدات الفرعية
