name: AI Core Deployment

on: [push, workflow_dispatch]

jobs:
  operational_run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Environment
        run: pip install -r requirements.txt
      - name: Execute Autonomous Logic
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: |
          python -c "from agent_executor import agent_executor; agent_executor.invoke({'input': 'افحص الرادار، وإذا وجدت أهدافاً شوش عليها فوراً ثم أرسل تقريراً بالإيميل بنجاح الحقن ومدى الرادار'})"
