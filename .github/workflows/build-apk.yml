name: Aegis Tactical Master v7.2.6 - Autonomous Final Build

on:
  push:
    branches: [ "main", "Master", "master" ]
  workflow_dispatch:

jobs:
  finalize_build_sequence:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
          generate-job-summary: true

      # ✅ إصلاح أمر البناء
      - name: Build APK
        run: gradle assembleDebug

      - name: Rename and Verify APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK file not found!"
            exit 1
          fi
          mv "$APK_PATH" Aegis_Tactical_v7.2.6_Master_Final.apk
          echo "FINAL_APK=Aegis_Tactical_v7.2.6_Master_Final.apk" >> $GITHUB_ENV

      - name: Upload Internal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aegis-Tactical-Master-Final
          path: ${{ env.FINAL_APK }}

      # ✅ إصلاح شرط if + إزالة مشكلة YAML
      - name: Release APK
        uses: softprops/action-gh-release@v1
        if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Master' || github.ref == 'refs/heads/master' }}
        with:
          files: ${{ env.FINAL_APK }}
          tag_name: v7.2.6-Final
          name: Aegis Tactical v7.2.6 Master Final
          body: "Aegis Tactical build"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
