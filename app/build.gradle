plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    // الهوية البرمجية الموحدة لمنظومة AEGIS - العقيد علي العماري
    namespace 'com.jamesfirstok.aegis' 
    compileSdk 34

    defaultConfig {
        applicationId "com.jamesfirstok.aegis"
        minSdk 24 
        targetSdk 34
        versionCode 8
        versionName "1.0.8-Sovereign-Master"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        vectorDrawables {
            useSupportLibrary true
        }

        // إعدادات الربط مع النواة الصلبة (C++) لضمان سرعة المعالجة الراديوية
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                abiFilters "armeabi-v7a", "arm64-v8a"
            }
        }
    }

    buildTypes {
        release {
            // بروتوكول التخفي الرقمي: تشفير الكود وتصغير الحجم لمنع التجسس البرمجي
            minifyEnabled true 
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // ربط ملف CMakeLists.txt (الذي يحتوي على إعدادات Aegis Security Lib)
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        viewBinding true // مضاف لدعم الربط مع واجهة XML إذا لزم الأمر
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.1'
    }
}

dependencies {
    // 1. النواة الأساسية ودعم بيئة الأندرويد الميدانية
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // 2. واجهة المستخدم التكتيكية (Jetpack Compose) للعرض الراداري
    implementation platform('androidx.compose:compose-bom:2023.08.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'

    // 3. محرك الذكاء الاصطناعي السيادي (تحليل الأنماط والتهديدات)
    implementation 'org.tensorflow:tensorflow-lite:2.12.0'

    // 4. ترسانة الرصد والاتصال التكتيكي (SIGINT & Drone Link)
    implementation 'com.github.mik3y:usb-serial-for-android:3.7.0' // للربط مع أجهزة الرصد الخارجية
    implementation 'org.mavlink:mavlink-sdk:2.4.1'               // بروتوكول السيطرة على الدرونز
    implementation 'com.google.android.gms:play-services-maps:18.2.0' // الخرائط العسكرية
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'      // الاتصال المؤمن بالسيرفرات السيادية
    
    // 5. حماية البيانات المتقدمة
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
}
