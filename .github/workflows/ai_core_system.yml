name: AI Autonomous Master Core

on:
  push:
    branches:
      - Master

jobs:
  ai-process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install AI Dependencies
        run: pip install openai>=1.0.0

      - name: Run AI Debugger & Developer
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python src/core.py

      # --- مرحلة التنظيم الهيكلي المتقدم والتحقق الذكي من المسارات ---
      - name: AI Logic for Gradle Relocation and Repair
        run: |
          echo "🛡️ جاري تنظيف وتنظيم الهيكل التكتيكي..."
          # إنشاء المجلد المستهدف فوراً
          mkdir -p gradle/wrapper
          
          # نقل ملفات الـ Wrapper إذا كانت تائهة في الجذر (Root)
          if [ -f "gradle-wrapper.jar" ]; then
            echo "📦 نقل ملف JAR إلى المسار الصحيح..."
            mv gradle-wrapper.jar gradle/wrapper/
          fi
          
          if [ -f "gradle-wrapper.properties" ]; then
            echo "⚙️ نقل ملف Properties إلى المسار الصحيح..."
            mv gradle-wrapper.properties gradle/wrapper/
          fi

          # التحقق النهائي: إذا لم يتم العثور على الملفات في أي مكان، يتم توليدها
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "⚠️ ملف القلب مفقود تماماً، جاري إعادة توليده برمجياً..."
            gradle wrapper --gradle-version 8.2
          fi

          # إصلاح نهايات الأسطر (لحل مشكلة ملفات ويندوز على لينكس)
          sed -i 's/\r$//' gradlew || echo "Already Linux format"
          
          # منح صلاحية الإطلاق للمحرك الرئيسي
          chmod +x gradlew
          echo "✅ تم تجهيز المحرك وضبط المسارات بنجاح."

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # --- قبول تراخيص أندرويد آلياً لضمان استمرارية الهجوم ---
      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || echo "Licenses already accepted"

      - name: Build Tactical APK
        # استخدام الذاكرة القصوى لضمان معالجة خوارزميات C++ والذكاء الاصطناعي
        run: ./gradlew assembleDebug -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Commit and Push Improvements
        run: |
          git config --global user.name "AI-Master-Bot"
          git config --global user.email "bot@ai-master.com"
          git add .
          # استخدام autostash لحماية البيانات من التصادم أثناء المزامنة
          git pull origin Master --rebase --autostash
          git commit -m "🤖 [AI Core] تم تفعيل وضع العمليات وبناء السيادة v1.0.9" || echo "No changes to commit"
          git push origin Master

      - name: Upload Sovereign APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Aegis-Tactical-v1.0.9-Operational
          path: app/build/outputs/apk/debug/app-debug.apk
